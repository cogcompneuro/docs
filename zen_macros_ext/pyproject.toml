[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zen-macros-ext"
version = "0.1.0"
description = "Local Markdown extension that keeps mkdocs-macros content working under Zensical"
authors = [{ name = "Nathan S.", email = "maths-ns@naths.ch" }]
dependencies = ["jinja2", "markdown"]
requires-python = ">=3.10"

[project.optional-dependencies]
dev = []

