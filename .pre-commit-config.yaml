repos:
  - repo: local
    hooks:
      - id: flowmark
        name: flowmark
        language: system
        entry: uvx flowmark --inplace --nobackup --semantic --cleanups
        types: [markdown]
        exclude: ^(snippets/|docs/2026/Proceedings/Submission guidelines\.md)

  - repo: https://github.com/jackdewinter/pymarkdown
    rev: v0.9.33
    hooks:
      - id: pymarkdown
        args:
          - --config=.github/config/pymarkdown.json
          - scan
