repos:
  - repo: local
    hooks:
      - id: flowmark
        name: flowmark
        language: system
        entry: uvx flowmark --auto
        types: [markdown]

  - repo: https://github.com/jackdewinter/pymarkdown
    rev: v0.9.33
    hooks:
      - id: pymarkdown
        args:
          - --config=.github/config/pymarkdown.json
          - scan
